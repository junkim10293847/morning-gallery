<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6EFE3">
<title>모닝 갤러리</title>
<!-- 버전 기록: v1.0 첫 버전 / v1.1 Chirp3 HD 목소리·목소리 들어보기 / v1.2 키 공백 제거·오류 안내 / v1.3 Gemini 음성 / v1.4 버전 표시 / v1.5 편마다 목소리 선택 / v1.6 키 확인 버튼 / v1.7 새 형식 Gemini 키(AQ.) 지원 / v1.8 원고 모델 gemini-3.8-flash, 모델 중단 시 자동 전환 / v1.9 응답 대기 시간 표시·2분 제한 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6EFE3;--card:#FFFDF8;--ink:#362A1C;--sub:#8C7452;--gold:#B0843A;--line:#E6DCCB;--ok:#5E8B4E;--warn:#C0563B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;padding-bottom:76px}
header{padding:14px 16px 6px;text-align:center}
header h1{font:600 20px "Noto Serif KR",serif;margin:0}
header p{margin:0;color:var(--sub);font-size:12px}
main{max-width:640px;margin:0 auto;padding:0 16px}
section.tab{display:none}section.tab.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 0;font:500 14px inherit;color:var(--sub)}
nav button.on{color:var(--gold);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:16px;margin:0 0 10px}
h2 .n{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;text-align:center;font-size:13px;line-height:22px;margin-right:6px}
label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
textarea{min-height:64px;resize:vertical}
button.b{border:0;border-radius:10px;padding:10px 14px;font:500 14px inherit;background:#EFE5D3;color:var(--ink)}
button.p{background:var(--gold);color:#fff}
button.w{background:none;color:var(--warn);padding:6px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.row>.fit{flex:0 0 auto}
.ep{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.ep:last-child{border:0}
.ep .d{width:54px;text-align:center;font-size:12px;color:var(--sub)}
.ep .d b{display:block;font-size:18px;color:var(--ink)}
.ep .t{flex:1;min-width:0}
.ep .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;padding:1px 7px;border-radius:9px;background:#EFE5D3;color:var(--sub);margin-right:4px}
.badge.g{background:#F3E4C4;color:var(--gold)}
.dots{font-size:11px;color:var(--sub);margin-top:2px}
.dots i{font-style:normal;margin-right:6px}.dots i.y{color:var(--ok);font-weight:700}
.today{background:#FFF6E6}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#eee}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs span{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:0 5px}
.thumbs button{position:absolute;right:2px;top:2px;border:0;background:rgba(255,255,255,.85);border-radius:6px;font-size:11px}
.scene{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.scene .hd{display:flex;align-items:center;gap:8px}
.scene .hd img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#eee}
.scene .hd b{flex:1}
.aud{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--sub)}
.aud button{padding:6px 10px;font-size:12px}
.need{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.need a{color:var(--gold);margin-left:6px;font-size:12px}
.muted{color:var(--sub);font-size:12px}
.msg{font-size:13px;color:var(--sub);margin-top:6px;min-height:1em}
.bar{height:6px;background:#EFE5D3;border-radius:3px;overflow:hidden;margin-top:8px}
.bar div{height:100%;width:0;background:var(--gold)}
canvas#cv{width:100%;max-width:270px;display:block;margin:10px auto;border-radius:10px;border:1px solid var(--line)}
video{width:100%;max-width:270px;display:block;margin:10px auto;border-radius:10px}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.count{float:right;font-size:11px}
.empty{text-align:center;color:var(--sub);padding:26px 0}
</style>
</head>
<body>
<header><h1>☀ Morning Gallery</h1><p>정책서 · 원고 · 음성 · 사진 · 영상 · 일정</p><p id="ver" style="font-size:11px;color:#B0843A">v1.9 · 2026-11-11</p></header>
<main>

<!-- 일정 -->
<section class="tab on" id="tab-plan">
  <div class="row" style="margin-top:10px">
    <button class="b p" id="btnNew">+ 새 편</button>
    <button class="b" id="btnSuggest">주제 7일 추천</button>
  </div>
  <div class="msg" id="planMsg"></div>
  <div class="card" style="padding:0" id="epList"></div>
</section>

<!-- 만들기 -->
<section class="tab" id="tab-make">
  <div id="noEp" class="empty">일정에서 편을 고르세요</div>
  <div id="editor" style="display:none">
    <div class="card">
      <div class="row"><input type="date" id="eDate" class="fit" style="flex:0 0 150px"><select id="eFormat" class="fit" style="flex:0 0 90px"><option>화가</option><option>그림</option></select></div>
      <label>주제</label><input id="eTopic" placeholder="예: 젠틸레스키 / 밀레 「만종」">
      <div class="row" style="margin-top:8px"><span class="muted" id="eNext"></span><button class="w fit" id="btnDel">편 삭제</button></div>
    </div>

    <div class="card">
      <h2><span class="n">1</span>원고</h2>
      <button class="b p" id="btnWrite">정책서대로 원고 쓰기</button>
      <div class="msg" id="writeMsg"></div>
      <label>제목</label><input id="eTitle">
      <label>머리말</label><input id="eHeader" placeholder="오늘의 화가 · 홍길동">
      <label>유튜브 설명</label><textarea id="eDesc"></textarea>
      <label>네이버 클립 설명 <span class="count" id="clipCount"></span></label><textarea id="eClip"></textarea>
      <div id="needBox" style="display:none"><label>찾을 그림</label><div id="needs"></div></div>
    </div>

    <div class="card">
      <h2><span class="n">2</span>사진</h2>
      <p class="muted" style="margin:0 0 8px">찾은 그림을 순서대로 올리세요. 번호가 장면과 연결됩니다.</p>
      <input type="file" id="imgIn" accept="image/*" multiple>
      <div class="thumbs" id="thumbs" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2><span class="n">3</span>장면 · 음성</h2>
      <label>이 편 목소리</label>
      <div class="row"><select id="eVoice">
      <optgroup label="Gemini 음성 (원고용 AI Studio 키 그대로 사용)">
      <option value="gemini:Aoede">◆ 여성 아오이드</option>
      <option value="gemini:Kore">◆ 여성 코레</option>
      <option value="gemini:Charon">◆ 남성 카론</option>
      <option value="gemini:Orus">◆ 남성 오루스</option>
      </optgroup>
      <optgroup label="Google Cloud 음성 (음성 키 필요)">
      <option value="ko-KR-Chirp3-HD-Aoede">★ 여성 아오이드 (가장 자연스러움)</option>
      <option value="ko-KR-Chirp3-HD-Kore">★ 여성 코레</option>
      <option value="ko-KR-Chirp3-HD-Charon">★ 남성 카론 (낮고 차분)</option>
      <option value="ko-KR-Chirp3-HD-Orus">★ 남성 오루스</option>
      <option value="ko-KR-Neural2-A">여성 A (차분)</option>
      <option value="ko-KR-Neural2-B">여성 B (밝음)</option>
      <option value="ko-KR-Neural2-C">남성 C</option>
      <option value="ko-KR-Wavenet-D">남성 D (낮음)</option>
      </optgroup>
    </select><button class="b fit" id="btnEVoiceTest">▶ 들어보기</button></div>
      <div class="row" style="margin-top:8px"><button class="b p" id="btnTTS">전체 음성 만들기</button></div>
      <div class="msg" id="ttsMsg"></div>
      <div id="scenes"></div>
      <button class="b" id="btnAddScene" style="margin-top:10px">+ 장면 추가</button>
    </div>

    <div class="card">
      <h2><span class="n">4</span>영상</h2>
      <label>배경음악</label>
      <div class="row"><select id="eMusic"><option value="차분">자동 · 차분</option><option value="밝게">자동 · 밝게</option><option value="어둡게">자동 · 어둡게</option><option value="파일">내 음악 파일</option><option value="없음">없음</option></select></div>
      <input type="file" id="musicIn" accept="audio/*" style="display:none;margin-top:6px">
      <div class="row" style="margin-top:10px"><button class="b" id="btnPreview">미리보기</button><button class="b p" id="btnRender">영상 만들기</button></div>
      <p class="muted">영상 길이만큼 걸립니다. 그동안 화면을 켜 두세요.</p>
      <div class="bar"><div id="bar"></div></div>
      <div class="msg" id="renderMsg"></div>
      <canvas id="cv" width="1080" height="1920"></canvas>
      <video id="vid" controls playsinline style="display:none"></video>
      <div class="row" id="outBtns" style="display:none"><button class="b p" id="btnShare">공유 / 저장</button></div>
    </div>

    <div class="card">
      <h2><span class="n">5</span>올리기 · 예약</h2>
      <div class="row"><button class="b" data-copy="eTitle">제목 복사</button><button class="b" data-copy="eDesc">설명 복사</button><button class="b" data-copy="eClip">클립 복사</button></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="eYt" style="width:auto"> 유튜브 예약 완료</label>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="eNv" style="width:auto"> 네이버 클립 예약 완료</label>
      <label>링크 (선택)</label><input id="eLink" placeholder="https://youtube.com/shorts/...">
    </div>
  </div>
</section>

<!-- 정책 -->
<section class="tab" id="tab-policy">
  <div class="card">
    <h2>정책서</h2>
    <p class="muted" style="margin:0 0 6px">원고 쓰기와 주제 추천에 그대로 쓰입니다. 언제든 고치세요.</p>
    <textarea id="sPolicy" style="min-height:360px;font-size:13px"></textarea>
    <div class="row" style="margin-top:8px"><button class="b fit" id="btnPolicyReset">처음 정책서로</button></div>
  </div>
  <div class="card">
    <h2>원고 엔진</h2>
    <label>사용할 AI</label>
    <select id="sEngine"><option value="gemini">Google Gemini (무료 키 가능)</option><option value="claude">Anthropic Claude API</option></select>
    <label>API 키</label><input id="sTextKey" type="password" autocomplete="off">
    <label>모델 (비우면 기본값)</label><input id="sModel" placeholder="gemini-3.8-flash / claude-sonnet-5-5">
    <button class="b p" id="btnKeyCheck" style="margin-top:10px;width:100%">키 확인 (원고 · 음성)</button>
    <div class="msg" id="keyMsg"></div>
  </div>
  <div class="card">
    <h2>음성</h2>
    <label>Google Cloud 음성(Text-to-Speech) API 키</label><input id="sTtsKey" type="password" autocomplete="off">
    <label>기본 목소리 (새 편에 처음 들어가는 값, 편마다 바꿀 수 있음)</label>
    <select id="sVoice">
      <optgroup label="Gemini 음성 (원고용 AI Studio 키 그대로 사용)">
      <option value="gemini:Aoede">◆ 여성 아오이드</option>
      <option value="gemini:Kore">◆ 여성 코레</option>
      <option value="gemini:Charon">◆ 남성 카론</option>
      <option value="gemini:Orus">◆ 남성 오루스</option>
      </optgroup>
      <optgroup label="Google Cloud 음성 (음성 키 필요)">
      <option value="ko-KR-Chirp3-HD-Aoede">★ 여성 아오이드 (가장 자연스러움)</option>
      <option value="ko-KR-Chirp3-HD-Kore">★ 여성 코레</option>
      <option value="ko-KR-Chirp3-HD-Charon">★ 남성 카론 (낮고 차분)</option>
      <option value="ko-KR-Chirp3-HD-Orus">★ 남성 오루스</option>
      <option value="ko-KR-Neural2-A">여성 A (차분)</option>
      <option value="ko-KR-Neural2-B">여성 B (밝음)</option>
      <option value="ko-KR-Neural2-C">남성 C</option>
      <option value="ko-KR-Wavenet-D">남성 D (낮음)</option>
      </optgroup>
    </select>
    <button class="b" id="btnVoiceTest" style="margin-top:8px">목소리 들어보기</button> <span class="muted" id="voiceMsg"></span>
    <label>속도</label><select id="sRate"><option value="0.9">조금 느리게</option><option value="1.0">보통</option><option value="1.08">조금 빠르게</option></select>
    <label>발음 사전 (한 줄에 하나, 자막=읽기)</label><textarea id="sPron" placeholder="바니시=바니쉬"></textarea>
  </div>
  <div class="card">
    <h2>백업</h2>
    <p class="muted" style="margin:0 0 8px">정책서와 일정·원고를 파일로 보관하거나 다른 기기로 옮깁니다 (사진·음성 제외).</p>
    <div class="row"><button class="b" id="btnExport">내보내기</button><button class="b" id="btnImport">가져오기</button></div>
    <input type="file" id="importIn" accept=".json" style="display:none">
  </div>
</section>
</main>

<nav><button data-tab="plan" class="on">일정</button><button data-tab="make">만들기</button><button data-tab="policy">정책서</button></nav>

<dialog id="dlgNew">
  <h2>새 편</h2>
  <label>공개일</label><input type="date" id="nDate">
  <label>형식</label><select id="nFormat"><option>화가</option><option>그림</option></select>
  <label>주제</label><input id="nTopic" placeholder="예: 에드가 드가">
  <div class="row" style="margin-top:14px"><button class="b" id="nCancel">취소</button><button class="b p" id="nOk">추가</button></div>
</dialog>

<script>
/* ───────── 기본 정책서 ───────── */
const DEFAULT_POLICY = `[모닝 갤러리 정책서]

1. 채널
- 유튜브 @모닝갤러리 · 네이버 클립 @morninggallery_kr
- 매일 오전 6시 공개, 하루 한 편
- 시청층: 40~60대 중심, 아침에 가볍게 보는 교양

2. 형식 (하루씩 번갈아)
- 화가 편: 장면 13~15개, 나레이션 합계 약 80~90초. 대표작 7~10점으로 일생을 따라감
- 그림 편: 장면 11~14개, 약 60~75초. 한 점을 깊게 (숨은 이야기, 반전)

3. 제목 · 첫 문장
- 제목은 질문·사건형 + " | 화가 이름" (예: 1990년 사라진 그림, 그 화가는 왜 자기 얼굴만 80번 그렸을까? | 렘브란트)
- 첫 장면은 질문이나 사건으로 시작해 3초 안에 붙잡기
- 둘째 장면: "오늘의 화가, ○○입니다" / "오늘의 명화, ○○의 「○○」입니다"

4. 문장
- 한 장면 1~2문장, 40자 안팎, 쉬운 말, 존댓말(~습니다 / ~죠)
- 쉼표로 호흡을 끊어 자막 두 줄에 맞게
- 갈리는 사실은 "~로 알려져 있죠", "~라고 전해집니다". 지어내지 않기
- 마지막 장면: "오늘 아침도, 명화 한 점으로 시작하세요. 좋은 아침 되세요."
- 다음 편이 정해져 있으면 마지막 앞 장면에 한 줄 예고

5. 피할 것
- 노출이 큰 그림, 참수·피 등 잔혹한 장면 (고디바 편 중단 사례)
- 화가 사후 70년이 지나지 않은 작품
- 개인사의 어두운 부분은 사실만 짧게

6. 그림
- 위키미디어 공용 Google Art Project 판 우선, 긴 쪽 1600px 이상 (그림 편은 3000px 이상)
- 한국 그림은 국립중앙박물관 e뮤지엄 공공누리 제1유형, 설명에 출처 표기
- 작품 표기: "작품명 · 연도" (추정이면 "1665년경")

7. 설명 · 해시태그
- 유튜브 설명 3~4줄 + 해시태그 5개 이내 (#모닝갤러리 포함)
- 네이버 클립 설명 300자 이내, 첫 줄에 작품명·화가 이름 (검색 유입)

8. 차별화
- 흔한 소재는 "숨은 것 찾기", "반전", "사건" 각도로
- 카라바조 → 렘브란트 → 젠틸레스키처럼 이어지는 흐름 만들기
- 이미 올린 주제: 베르메르, 클림트, 고흐 별이 빛나는 밤, 카라바조, 렘브란트, 김홍도 씨름, 젠틸레스키, 밀레 만종, 드가`;

/* ───────── 저장소 ───────── */
const $ = s => document.querySelector(s);
let DB, EPS = [], CUR = null, IMGURL = {};
const DEF = {policy: DEFAULT_POLICY, engine: 'gemini', textKey: '', model: '', ttsKey: '', voice: 'gemini:Aoede', rate: '1.0', pron: ''};
let S = {...DEF};
try { S = {...DEF, ...JSON.parse(localStorage.getItem('mg-settings') || '{}')}; } catch (e) {}
function saveS() { try { localStorage.setItem('mg-settings', JSON.stringify(S)); } catch (e) {} }

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('morning-gallery', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('eps', {keyPath: 'id'}); d.createObjectStore('blobs'); };

async function fetchT(url, opt, sec = 120) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), sec * 1000);
  try { return await fetch(url, {...opt, signal: c.signal}); }
  catch (e) { if (e.name === 'AbortError') throw new Error(`${sec}초 동안 응답이 없습니다. 인터넷 연결을 확인하고 다시 누르세요`); throw new Error('연결 실패: ' + e.message); }
  finally { clearTimeout(t); }
}
async function askAI(prompt) {
  if (!S.textKey) throw new Error('정책서 탭에서 원고 엔진 API 키를 넣으세요');
  let text;
  if (S.engine === 'claude') {
    const r = await fetchT('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'x-api-key': S.textKey, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true'},
      body: JSON.stringify({model: S.model || 'claude-sonnet-5-5', max_tokens: 6000, messages: [{role: 'user', content: prompt}]})
    });
    const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || r.status);
    text = j.content.map(c => c.text || '').join('');
  } else {
    let m = S.model || 'gemini-3.8-flash', r, j;
    for (let tries = 0; tries < 2; tries++) {
      r = await fetchT(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
        method: 'POST', headers: {'content-type': 'application/json', 'x-goog-api-key': S.textKey},
        body: JSON.stringify({contents: [{parts: [{text: prompt}]}], generationConfig: {responseMimeType: 'application/json', temperature: 0.8}})
      });
      j = await r.json().catch(() => ({}));
      const alt = /use models\/([\w.-]+)/.exec(j.error?.message || '');
      if (!r.ok && alt && alt[1] !== m) { m = alt[1]; S.model = m; saveS(); try { $('#sModel').value = m; } catch (e) {} continue; }
      break;
    }
    if (!r.ok) throw new Error(j.error?.message || r.status);
    text = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  }
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a < 0) throw new Error('결과를 읽지 못했습니다');
  return JSON.parse(text.slice(a, b + 1));
}

const MOODS = {'밝게': [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 67]], '차분': [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]], '어둡게': [[57, 60, 64, 67], [53, 57, 60, 65], [48, 52, 55, 60], [52, 56, 59, 64]]};
